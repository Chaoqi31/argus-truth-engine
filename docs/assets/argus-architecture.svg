<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 720" role="img" aria-labelledby="title desc">
  <title id="title">Argus project architecture</title>
  <desc id="desc">Argus local self-host architecture from the Next.js audit workspace through FastAPI, LangGraph, model calls, persistence, and the live WebSocket trace.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5b33d6" />
    </marker>
    <style>
      .bg { fill: #fbfbfd; }
      .panel { fill: #ffffff; stroke: #d9dce8; stroke-width: 1.4; }
      .box { fill: #ffffff; stroke: #c9cedd; stroke-width: 1.3; }
      .phase { fill: #f6f4ff; stroke: #7c4dff; stroke-width: 1.5; }
      .store { fill: #f2f9f6; stroke: #3a9d6d; stroke-width: 1.3; }
      .model { fill: #fff7e8; stroke: #d99022; stroke-width: 1.2; }
      .line { fill: none; stroke: #5b33d6; stroke-width: 1.7; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #5b33d6; stroke-width: 1.5; stroke-dasharray: 6 5; marker-end: url(#arrow); }
      .mutedLine { fill: none; stroke: #98a1b5; stroke-width: 1.4; marker-end: url(#arrow); }
      .title { fill: #171923; font: 700 26px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .h { fill: #171923; font: 700 15px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .t { fill: #4f566b; font: 12px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .small { fill: #687087; font: 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .tag { fill: #5b33d6; font: 700 11px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; letter-spacing: .06em; }
      .mono { fill: #31384a; font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect class="bg" width="1120" height="720" rx="22" />
  <text class="title" x="48" y="48">Argus Architecture</text>
  <text class="t" x="48" y="72">Local audit flow: private keys, persistent history, live trace, and human-controlled verification.</text>

  <rect class="panel" x="40" y="100" width="240" height="132" rx="12" />
  <text class="tag" x="62" y="130">FRONTEND</text>
  <text class="h" x="62" y="154">Next.js audit workspace</text>
  <text class="t" x="62" y="178">Paste text or upload PDF</text>
  <text class="t" x="62" y="198">Model switch per run</text>
  <text class="t" x="62" y="218">History browse and delete</text>

  <rect class="panel" x="350" y="100" width="240" height="132" rx="12" />
  <text class="tag" x="372" y="130">API</text>
  <text class="h" x="372" y="154">FastAPI backend</text>
  <text class="t" x="372" y="178">Jobs, auth, shares, exports</text>
  <text class="t" x="372" y="198">Provider keys and job control</text>
  <text class="t" x="372" y="218">WebSocket live trace</text>

  <rect class="store" x="840" y="100" width="240" height="132" rx="12" />
  <text class="tag" x="862" y="130">LOCAL DATA</text>
  <text class="h" x="862" y="154">Postgres + volumes</text>
  <text class="t" x="862" y="178">Jobs, claims, findings</text>
  <text class="t" x="862" y="198">Reasoning traces, evidence</text>
  <text class="t" x="862" y="218">Uploads and generated reports</text>

  <path class="line" d="M280 166 H345" />
  <path class="mutedLine" d="M590 166 H835" />
  <path class="dash" d="M350 214 C250 270 150 270 92 232" />
  <text class="small" x="153" y="278">trace events stream back while the job runs</text>

  <rect class="panel" x="40" y="290" width="1040" height="375" rx="16" />
  <text class="tag" x="64" y="320">ORCHESTRATION</text>
  <text class="h" x="64" y="344">LangGraph 10-stage pipeline</text>

  <rect class="phase" x="72" y="374" width="250" height="218" rx="12" />
  <text class="tag" x="96" y="404">PHASE A</text>
  <text class="h" x="96" y="428">Claim extraction</text>
  <text class="mono" x="96" y="462">parse</text>
  <text class="mono" x="96" y="492">planner</text>
  <text class="mono" x="96" y="522">atomizer</text>
  <text class="mono" x="96" y="552">checkworthiness</text>
  <text class="small" x="96" y="578">typed claims; low-value dropped</text>

  <rect class="box" x="385" y="404" width="180" height="138" rx="12" />
  <text class="tag" x="410" y="434">HITL GATE</text>
  <text class="h" x="410" y="458">Review queue</text>
  <text class="t" x="410" y="482">Dedupe claims</text>
  <text class="t" x="410" y="502">Apply cost cap</text>
  <text class="t" x="410" y="522">Select claims to verify</text>

  <rect class="phase" x="628" y="360" width="420" height="248" rx="12" />
  <text class="tag" x="652" y="390">PHASE B</text>
  <text class="h" x="652" y="414">Verification and synthesis</text>

  <rect class="box" x="652" y="438" width="170" height="72" rx="10" />
  <text class="h" x="672" y="464">UnifiedVerifier</text>
  <text class="t" x="672" y="486">researches each selected claim</text>

  <rect class="box" x="852" y="438" width="170" height="72" rx="10" />
  <text class="h" x="872" y="464">Consistency</text>
  <text class="t" x="872" y="486">cross-claim contradictions</text>

  <rect class="box" x="652" y="534" width="170" height="52" rx="10" />
  <text class="h" x="672" y="558">Skeptic</text>
  <text class="t" x="672" y="578">challenge pass when needed</text>

  <rect class="box" x="852" y="534" width="170" height="52" rx="10" />
  <text class="h" x="872" y="558">Confidence</text>
  <text class="t" x="872" y="578">score, report, export</text>

  <rect class="model" x="72" y="616" width="250" height="32" rx="16" />
  <text class="small" x="99" y="637">Extraction model + rules: no live web</text>

  <rect class="model" x="628" y="616" width="195" height="32" rx="16" />
  <text class="small" x="664" y="637">Autonomous web verifier</text>

  <rect class="model" x="852" y="616" width="196" height="32" rx="16" />
  <text class="small" x="879" y="637">Scoring and report synthesis</text>

  <path class="line" d="M590 232 C590 268 475 274 475 398" />
  <path class="line" d="M322 482 H380" />
  <path class="line" d="M565 472 H623" />
  <path class="line" d="M737 510 V529" />
  <path class="mutedLine" d="M822 474 H847" />
  <path class="line" d="M822 560 H847" />
  <path class="mutedLine" d="M1048 500 C1088 500 1088 220 1080 206" />

  <text class="small" x="590" y="432">fan-out selected claims</text>
  <text class="small" x="1020" y="372" transform="rotate(90 1020 372)">persist every job artifact</text>
</svg>
